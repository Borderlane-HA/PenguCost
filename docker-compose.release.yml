services:
  pengucost:
    image: ghcr.io/borderlane-ha/pengucost:${PENGUCOST_VERSION:-latest}
    container_name: pengucost
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - pengucost_data:/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  pengucost_data:
